{% extends "base.html" %}
{% load static %}

{% block title %}Add Income - SIMPS{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <a href="{% url 'dashboard:dashboard_home' %}" class="inline-flex items-center text-blue-600 hover:text-blue-800 mb-6 transition">
        <i class="fas fa-arrow-left mr-2"></i>
        Back to Dashboard
    </a>

    <div class="bg-white shadow-lg rounded-xl p-8 border border-gray-100">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">Add Income</h1>
        
        <div id="message" class="hidden mb-4 p-4 rounded-lg"></div>

        <form id="incomeForm" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Month <span class="text-red-500">*</span></label>
                <select name="month" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="">Select Month</option>
                    <option value="1">January</option><option value="2">February</option><option value="3">March</option>
                    <option value="4">April</option><option value="5">May</option><option value="6">June</option>
                    <option value="7">July</option><option value="8">August</option><option value="9">September</option>
                    <option value="10">October</option><option value="11">November</option><option value="12">December</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Year <span class="text-red-500">*</span></label>
                <input type="number" name="year" required min="2000" max="2100" value="2026" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Amount <span class="text-red-500">*</span></label>
                <div class="relative">
                    <span class="absolute left-3 top-2 text-gray-500 text-lg">$</span>
                    <input type="number" name="amount" required min="0" step="0.01" class="w-full pl-8 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="0.00">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Source <span class="text-red-500">*</span></label>
                <input type="text" name="source" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="e.g., Salary, Freelance">
            </div>

            <div class="flex gap-4">
                <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition font-medium">
                    <i class="fas fa-plus mr-2"></i> Add Income
                </button>
                <a href="{% url 'dashboard:dashboard_home' %}" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg hover:bg-gray-300 transition font-medium text-center">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.getElementById('incomeForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = {
            month: parseInt(formData.get('month')),
            year: parseInt(formData.get('year')),
            amount: parseFloat(formData.get('amount')),
            source: formData.get('source')
        };

        try {
            const response = await fetch("{% url 'dashboard:add_income' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            const messageDiv = document.getElementById('message');
            // Using green for success and red for errors
            messageDiv.className = `mb-4 p-4 rounded-lg ${result.status === 'success' ? 'bg-green-100 text-green-700 border border-green-200' : 'bg-red-100 text-red-700 border border-red-200'}`;
            messageDiv.textContent = result.status === 'success' ? 'Income added successfully!' : 'Error: ' + result.message;
            messageDiv.classList.remove('hidden');

            if (result.status === 'success') {
                setTimeout(() => { window.location.href = "{% url 'dashboard:dashboard_home' %}"; }, 1500);
            }
        } catch (error) {
            console.error('Error:', error);
        }
    });
</script>
{% endblock %}
