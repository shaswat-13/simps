{% extends "base.html" %}
{% load static %}

{% block title %}View Expenses - SIMPS{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-900">Expense History</h1>
        <a href="{% url 'dashboard:add_expense_page' %}" class="bg-red-600 text-white px-6 py-3 rounded-lg hover:bg-red-700 transition font-medium shadow-md">
            <i class="fas fa-plus mr-2"></i> Add Expense
        </a>
    </div>

    <div id="message" class="hidden mb-4 p-4 rounded-lg"></div>

    <div class="bg-white shadow-lg rounded-xl overflow-hidden border border-gray-100">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-red-50 border-b border-red-100">
                    <tr>
                        <th class="px-6 py-4 text-left text-sm font-semibold text-red-900">Date</th>
                        <th class="px-6 py-4 text-left text-sm font-semibold text-red-900">Category</th>
                        <th class="px-6 py-4 text-right text-sm font-semibold text-red-900">Amount</th>
                        <th class="px-6 py-4 text-center text-sm font-semibold text-red-900">Actions</th>
                    </tr>
                </thead>
                <tbody id="expenseTableBody" class="divide-y divide-gray-100"></tbody>
            </table>
        </div>
        <div id="emptyState" class="hidden p-12 text-center text-gray-500">
            <i class="fas fa-receipt text-5xl mb-4 text-gray-300"></i>
            <p class="text-lg">No expenses found.</p>
        </div>
    </div>

    <a href="{% url 'dashboard:dashboard_home' %}" class="inline-flex items-center text-blue-600 hover:text-blue-800 mt-6 font-medium">
        <i class="fas fa-arrow-left mr-2"></i> Back to Dashboard
    </a>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    async function loadExpenseData() {
        try {
            // Note: In production, user_id=1 should be handled by the backend session
            const response = await fetch("{% url 'dashboard:get_expenses' %}");
            const result = await response.json();
            const tableBody = document.getElementById('expenseTableBody');
            const emptyState = document.getElementById('emptyState');
            
            if (result.status === 'success' && result.data.length > 0) {
                tableBody.innerHTML = '';
                emptyState.classList.add('hidden');
                result.data.forEach(expense => {
                    tableBody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="px-6 py-4 text-sm text-gray-900 font-medium">${getMonthName(expense.month)} ${expense.year}</td>
                            <td class="px-6 py-4 text-sm text-gray-600">${expense.category}</td>
                            <td class="px-6 py-4 text-sm text-red-600 text-right font-bold">$${parseFloat(expense.amount).toFixed(2)}</td>
                            <td class="px-6 py-4 text-center">
                                <button onclick="deleteExpense(${expense.expense_id})" class="text-red-500 hover:text-red-700 p-2 transition">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>`;
                });
            } else { tableBody.innerHTML = ''; emptyState.classList.remove('hidden'); }
        } catch (error) { console.error(error); }
    }

    async function deleteExpense(expenseId) {
        if (!confirm('Are you sure you want to delete this entry?')) return;
        try {
            const response = await fetch("{% url 'dashboard:delete_expense' %}", {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ expense_id: expenseId })
            });
            const result = await response.json();
            if (result.status === 'success') { loadExpenseData(); }
        } catch (error) { console.error(error); }
    }

    function getMonthName(m) { return ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][m - 1]; }
    loadExpenseData();
</script>
{% endblock %}
